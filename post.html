<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/fortport.ico">
    <title>Загрузка...</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c7eaf5">
</head>
<body>
    <div class="feedmain post-page-feed">
        <div id="post-container"></div>
    </div>

    <script src="/scripts/cookie-auth.js"></script>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/delete.js"></script>
    <script src="/scripts/edit.js"></script>
    <script src="/scripts/post.js"></script>
    <script type="module" src="/scripts/crypto-utils.js"></script>
    <script type="module" src="/scripts/client.js"></script>
    <script type="module" src="/scripts/display-post.js"></script>
    <script type="module">
        import * as PostDisplay from './scripts/display-post.js'

        const urlParams = new URLSearchParams(window.location.search)
        const postId = urlParams.get('id')
        const targetCommentId = urlParams.get('comment')

        async function focusTargetComment(commentId) {
            if (!commentId) return
            for (let attempt = 0; attempt < 24; attempt += 1) {
                const comment = document.querySelector(`[data-comment-id="${CSS.escape(String(commentId))}"]`)
                if (comment) {
                    comment.scrollIntoView({ behavior: 'smooth', block: 'center' })
                    comment.classList.add('comment-notification-target')
                    setTimeout(() => comment.classList.remove('comment-notification-target'), 3200)
                    return
                }
                document.querySelectorAll('.toggle-replies-btn').forEach(button => {
                    if (button.offsetParent !== null && !button.dataset.notificationExpanded) {
                        button.dataset.notificationExpanded = 'true'
                        button.click()
                    }
                })
                await new Promise(resolve => setTimeout(resolve, 125))
            }
        }

        if (!postId) {
            window.location.href = '/'
        }

        async function loadPost() {
            try {
                // Option A: fetch all and filter (if you didn't add the server route)
                // const res = await fetch('/api/posts')
                // const posts = await res.json()
                // const post = posts.find(p => p.id == postId)

                // Option B: use single-post route (preferred)
                const res = await fetch(`/api/posts/${postId}`)
                if (!res.ok) throw new Error('Post not found')
                const post = await res.json()

                // Update page title
                let titleText = ''
                if (post.content && post.content.trim()) {
                    titleText = post.content.trim().substring(0, 30)
                    if (post.content.length > 30) titleText += '…'
                } else {
                    titleText = `публикация от ${post.username}`
                }
                document.title = titleText + ' | ФортПорт'

                // Load user map and display post
                await PostDisplay.loadUserMap()
                PostDisplay.displayPosts('post-container', [post], loadPost)
                await focusTargetComment(targetCommentId)
            } catch (err) {
                console.error(err)
                document.getElementById('post-container').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff4444;">
                        Публикация не найдена
                    </div>
                `
            }
        }

        loadPost()
    </script>
	<script src="/scripts/mascot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/fortport.ico">
    <title>ФортПорт - Аудио</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c7eaf5">
</head>
<body>
    <div class="audios-container">
        <!-- Player -->
        <div class="audios-player" id="audios-player">
            <div class="player-controls">
                <div class="player-info">
                    <div class="song-name" id="current-song-name">Нет аудио</div>
                    <div class="song-artist" id="current-song-artist">—</div>
                </div>
                
                <div class="player-volume">
                    <button class="player-btn" id="volume-btn" title="Без звука">
                        <img src="/ui/icons/volume.webp" alt="Volume" id="volume-icon" style="width:24px; height:24px;">
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
                </div>
            </div>
            <div class="player-progress">
                <span class="player-time" id="current-time">0:00</span>
                <input type="range" id="progress-slider" min="0" max="100" value="0">
                <span class="player-time" id="total-time">0:00</span>
            </div>
<div class="player-buttons">
                    <button class="player-btn" id="shuffle-btn" title="Перемешать">
                        <img src="/ui/icons/shuffle.webp" alt="Shuffle" style="width:24px; height:24px;">
                    </button>
                    <button class="player-btn" id="prev-btn" title="Предыдущий" style="margin-right:-4px;">
                        <img src="/ui/icons/prev.webp" alt="Previous" style="width:42px; height:42px;">
                    </button>
                    <button class="player-btn play-btn" id="play-btn" title="Воспроизвести">
                        <img src="/ui/icons/play.webp" alt="Play" id="play-icon" style="width:48px; height:48px;">
                    </button>
                    <button class="player-btn" id="next-btn" title="Следующий" style="margin-left:-5px;">
                        <img src="/ui/icons/next.webp" alt="Next" style="width:42px; height:42px;">
                    </button>
                    <button class="player-btn" id="repeat-btn" title="Повтор">
                        <img src="/ui/icons/repeat.webp" alt="Repeat" style="width:24px; height:24px;">
                    </button>
                </div>
        </div>

        <!-- Tabs & Content -->
        <div class="audios-content" id="audios-content" >
            <div class="audios-tabs"style="display:none;">
                <button class="audios-tab active" data-tab="library">Мои аудиозаписи</button>
                <button class="audios-tab" data-tab="playlists">Мои плейлисты</button>
            </div>
            <div id="library-view" style="padding-top: 20px;">
		<div style="display: flex; gap: 15px; align-items: center; margin-bottom: 10px;">
    <label style="font-size: 13px; color: #666;">
        <input type="checkbox" id="audios-sfx-toggle" ${localStorage.getItem('audiosSFX') === '1' ? 'checked' : ''}>
        Звуки плеера
    </label>
</div>
                <div class="upload-area">
                    <button class="upload-btn" id="upload-audio-btn">Загрузить аудио</button>
                    <input type="file" id="audio-file-input" accept="audio/*">
                    <span style="font-size: 13px; color: #666; align-self: center;">MP3, WAV, OGG, AAC, M4A, FLAC</span>
                </div>
                <div id="library-list">
                    <div class="empty-state">
                        <div class="empty-icon"><img src="/ui/icons/audios_aero.webp" style="width:56px; height:56px;"></div>
                        <div>У вас пока нет аудиозаписей</div>
                        <div style="font-size: 13px; margin-top: 8px;">Загрузите свою первую аудиозапись!</div>
                    </div>
                </div>
            </div>
            <div id="playlists-view" style="display: none; padding-top: 20px;">
                <div id="playlists-list">
                    <div class="empty-state">
                        <div class="empty-icon"><img src="/ui/icons/audios_aero.webp" style="width:56px; height:56px;"></div>
                        <div>У вас пока нет плейлистов</div>
                        <div style="font-size: 13px; margin-top: 8px;">Создайте свой первый плейлист!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/scripts/cookie-auth.js"></script>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/audios.js"></script>
    <script src="/scripts/mascot.js"></script>
</body>
<img src="/ui/big_disc.webp" class="audios-bg-disc" id="audios-bg-disc">
</html>

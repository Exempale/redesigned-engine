<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/fortport.ico">
    <title>ФортПорт - Порты</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c7eaf5">
    <style>
        .search-bar-container {
            margin: 20px;
            margin-bottom: 10px;
        }
        .search-bar-container input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #bccee2;
            border-radius: 8px;
            background: #edeff4;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .search-bar-container input:focus {
            outline: none;
            border-color: #8FDADB;
            box-shadow: 0 0 0 2px rgba(143, 218, 219, 0.2);
        }
        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .search-header h2 {
            font-size: 20px;
            margin: 0;
        }
        .close-search-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }
        .close-search-btn:hover {
            color: #ff4444;
        }
    </style>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="feedmain communities-page-container">
        <div style="display: flex; align-items:center; margin-top:-25px">
            <img src="/ui/icons/communities_aero.webp" style="height:75px; width:auto;">
            <h1 style="margin-left: 10px; margin-bottom: 5px; margin-top:25px;">Порты</h1>
            <a href="/new_community"><button class="postbutton" id="create-community-button" style="right:0; left:auto; margin-top:28px; margin-left:20px;">Новый порт</button></a>
        </div>

        <hr style="border: 1px solid #bccee2; margin: 10px 20px;">
        
        <!-- Search bar -->
        <div class="search-bar-container">
            <input type="text" id="community-search-input" placeholder="Поиск портов...">
        </div>
        
        <!-- Communities list container (visible by default) -->
        <div id="communities-list-container">
            <div style="margin: 20px;">
                <h2 style="font-size: 20px; margin-bottom: 15px;" id= "myPorts">Мои порты</h2>
                <div id="communities-list" class="communities-container">
                    <!-- Сюда будут загружаться порты -->
                </div>
            </div>
        </div>
        
        <!-- Search results container (hidden by default) -->
        <div id="community-search-container" style="display: none;">
            <div style="margin: 20px;">
                <div class="search-header">
                    <h2>Результаты поиска</h2>
                    <button class="close-search-btn" onclick="exitCommunitySearchMode()">✕</button>
                </div>
                <div id="community-search-list" class="communities-container">
                    <!-- Search results will appear here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="/scripts/cookie-auth.js"></script>
    <script type="module" src="/scripts/crypto-utils.js"></script>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/client.js"></script>
    <script src="/scripts/friends.js"></script>
    <script src="/scripts/communities_page.js"></script>
    <script src="/scripts/chat.js"></script>
	<script src="/scripts/mascot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/fortport.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c7eaf5">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        img, video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
        .meta-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            display: none;
        }
        .meta-info a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
        }
        .meta-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img id="media-content" src="" alt="Фото">
    <div class="meta-info" id="meta-info">
        <span id="meta-username"></span>
        <span id="meta-time"></span>
        <a id="meta-post-link" href="#">Посмотреть публикацию</a>
    </div>

    <script>
        const mediaId = window.PHOTO_ID || window.VIDEO_ID;
        const isVideo = window.VIDEO_ID !== undefined;
        const apiPath = isVideo ? `/api/video/${mediaId}` : `/api/photo/${mediaId}`;
        
        if (mediaId) {
            fetch(apiPath)
                .then(r => r.json())
                .then(data => {
                    const media = document.getElementById('media-content');
                    media.src = data.url || data.filePath;
                    if (isVideo) {
                        media.controls = true;
                        media.autoplay = true;
                    }
                    
                    // Show meta info if available
                    if (data.username || data.createdAt || data.postId) {
                        const metaInfo = document.getElementById('meta-info');
                        metaInfo.style.display = 'block';
                        
                        if (data.username) {
                            document.getElementById('meta-username').textContent = `${data.username}`;
                        }
                        if (data.createdAt) {
                            document.getElementById('meta-time').textContent = new Date(data.createdAt).toLocaleString('ru-RU');
                        }
                        if (data.postId) {
                            const link = document.getElementById('meta-post-link');
                            link.href = `/post?id=${data.postId}`;
                            link.textContent = 'Посмотреть публикацию';
                        }
                    }
                })
                .catch(err => console.error('Error loading media:', err));
        }
    </script>
</body>
</html>

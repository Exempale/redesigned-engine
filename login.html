<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="/fortport.ico">
    <meta charset="UTF-8">
    <title>ФортПорт - Войти</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c7eaf5">
<script>
  function isMobile() {
    return window.innerWidth <= 768 ||
           /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  }

  if (isMobile()) {
    window.location.href = "/mobile/login";
  }
</script>
    <style>
        body.auth-body {
            background-image: url('/reglogin_bg.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .auth-card {
            width: min(400px, 100%);
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            padding: 36px 34px 30px;
            border-radius: 18px;
            box-shadow: 0 24px 60px -18px rgba(0, 10, 90, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.85);
            animation: fp-fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            box-sizing: border-box;
        }

        .auth-logo {
            display: block;
            margin: 0 auto 6px;
            max-width: 240px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 10px rgba(0, 10, 90, 0.25));
        }

        .auth-card h1 {
            text-align: center;
            margin: 8px 0 2px;
            color: #15141c;
            font-size: 26px;
        }

        .auth-card h3 {
            text-align: center;
            margin: 0 0 22px;
            color: #4a5568;
            font-weight: 500;
            font-size: 15px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form input {
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #bccee2;
            border-radius: 10px;
            background: rgba(237, 239, 244, 0.85);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #8fdadb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(143, 218, 219, 0.35);
        }

        .auth-form button {
            background: linear-gradient(180deg, #bef1fc 0%, #8fdadb 100%);
            font-size: 17px;
            font-weight: 600;
            color: #15141c;
            border: 2px outset #b8cae0;
            padding: 14px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 8px;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 14px -6px rgba(0, 10, 90, 0.35);
        }

        .auth-form button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px -8px rgba(0, 10, 90, 0.4);
        }

        .auth-form button:active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
        }

        .auth-link a {
            color: #14458f;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #d63030;
            text-align: center;
            font-size: 15px;
            min-height: 20px;
            margin-bottom: 4px;
        }

        .success {
            color: #2e9e44;
            text-align: center;
            font-size: 15px;
        }

        .add-email-container {
            text-align: center;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #bccee2;
        }

        .add-email-container input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #bccee2;
            border-radius: 10px;
            background: rgba(237, 239, 244, 0.85);
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-card { animation: none; }
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-card">
        <img class="auth-logo" src="/ui/logos/main-page-logo.webp" alt="ФортПорт">
        <h1>Подключиться</h1>
        <h3>вход в аккаунт</h3>

        <div id="error" class="error" role="alert"></div>
        <div id="success" class="success" role="status"></div>

        <form class="auth-form" id="login-form">
            <input type="text" id="login-identifier" placeholder="Имя пользователя или Email" required autocomplete="username">
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit">Войти</button>
        </form>

        <div class="auth-link">
            <a href="/register">Нет аккаунта?</a>
        </div>

        <div id="add-email-container" class="add-email-container" style="display: none;">
            <p>Для безопасности, добавьте email к аккаунту:</p>
            <input type="email" id="add-email-input" placeholder="Email">
            <button id="add-email-btn" class="postbutton" style="margin-top: 10px;">Добавить email</button>
            <button id="skip-email-btn" style="background: none; border: none; color: #666; cursor: pointer; margin-top: 10px; font-size: 14px;">Пропустить</button>
        </div>
    </div>

    <script src="/scripts/login.js"></script>
</body>
</html>
